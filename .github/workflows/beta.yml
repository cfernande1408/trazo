# Canal beta: en cada push a main compila "Trazo beta" (otra app, firmada con la clave de la
# estable) y la deja en la pre-release "beta" de GitHub, siempre en el mismo enlace.
name: Beta

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta
  cancel-in-progress: true

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # para saber cuál es la última versión estable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Clave de firma
        id: key
        env:
          TRAZO_KEYSTORE_BASE64: ${{ secrets.TRAZO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TRAZO_KEYSTORE_BASE64" ]; then
            echo "::notice::Sin clave de firma en los secretos: no se publica la beta"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$TRAZO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/trazo.jks"
          echo "TRAZO_KEYSTORE=$RUNNER_TEMP/trazo.jks" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Versión
        if: steps.key.outputs.ok == 'true'
        run: |
          # Última estable + nº de ejecución: 0.3.0.57-beta
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          echo "TRAZO_VERSION_NAME=${last#v}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "TRAZO_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Tests y APK beta
        if: steps.key.outputs.ok == 'true'
        env:
          TRAZO_KEYSTORE_PASSWORD: ${{ secrets.TRAZO_KEYSTORE_PASSWORD }}
          TRAZO_KEY_ALIAS: ${{ secrets.TRAZO_KEY_ALIAS }}
          TRAZO_KEY_PASSWORD: ${{ secrets.TRAZO_KEY_PASSWORD }}
          TRAZO_SUPABASE_URL: ${{ secrets.TRAZO_SUPABASE_URL }}
          TRAZO_SUPABASE_ANON_KEY: ${{ secrets.TRAZO_SUPABASE_ANON_KEY }}
        run: |
          ./gradlew :core:gpx:test :app:assembleBeta
          cp app/build/outputs/apk/beta/app-beta.apk trazo-beta.apk

      # La pre-release se borra y se crea de nuevo: si solo se actualiza, GitHub sigue
      # mostrando la fecha de la primera y parece que no ha cambiado
      - name: Borrar la beta anterior
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete beta --yes || true

      # La etiqueta "beta" se mueve al commit nuevo y la pre-release se rehace con el APK
      - name: Mover la etiqueta beta
        if: steps.key.outputs.ok == 'true'
        run: |
          git tag -f beta
          git push -f origin beta

      - uses: softprops/action-gh-release@v2
        if: steps.key.outputs.ok == 'true'
        with:
          tag_name: beta
          name: Trazo beta ${{ env.TRAZO_VERSION_NAME }}
          prerelease: true
          make_latest: false
          files: trazo-beta.apk
          body: |
            Lo último de `main`, sin probar a fondo. Se instala como **Trazo beta**, aparte de la
            versión estable, y se actualiza encima de la beta anterior.

            Versión ${{ env.TRAZO_VERSION_NAME }}, commit ${{ github.sha }}: ${{ github.event.head_commit.message }}
