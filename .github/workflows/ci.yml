# Compila y prueba en cada push y pull request; deja el APK de debug como artefacto
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # con las etiquetas, para numerar la versión

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # El runner ya trae el SDK de Android; esto cachea Gradle entre ejecuciones
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests del núcleo
        run: ./gradlew :core:gpx:test --stacktrace

      - name: Compilar la app
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Informe de tests si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-tests
          path: core/gpx/build/reports/tests/
          if-no-files-found: ignore

      - name: APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: trazo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
