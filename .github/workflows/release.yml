# Al subir una etiqueta vX.Y.Z: compila el APK firmado y lo publica en GitHub Releases
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests del núcleo
        run: ./gradlew :core:gpx:test

      # La clave de firma va en los secretos del repo (ver README → Publicar una versión)
      - name: Clave de firma
        env:
          TRAZO_KEYSTORE_BASE64: ${{ secrets.TRAZO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TRAZO_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto TRAZO_KEYSTORE_BASE64"; exit 1
          fi
          echo "$TRAZO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/trazo.jks"
          echo "TRAZO_KEYSTORE=$RUNNER_TEMP/trazo.jks" >> "$GITHUB_ENV"

      - name: Compilar APK firmado
        env:
          TRAZO_KEYSTORE_PASSWORD: ${{ secrets.TRAZO_KEYSTORE_PASSWORD }}
          TRAZO_KEY_ALIAS: ${{ secrets.TRAZO_KEY_ALIAS }}
          TRAZO_KEY_PASSWORD: ${{ secrets.TRAZO_KEY_PASSWORD }}
          TRAZO_VERSION_NAME: ${{ github.ref_name }}
          TRAZO_VERSION_CODE: ${{ github.run_number }}
          TRAZO_SUPABASE_URL: ${{ secrets.TRAZO_SUPABASE_URL }}
          TRAZO_SUPABASE_ANON_KEY: ${{ secrets.TRAZO_SUPABASE_ANON_KEY }}
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "trazo-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: trazo-*.apk
          generate_release_notes: true
