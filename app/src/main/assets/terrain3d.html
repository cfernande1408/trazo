<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Trazo 3D</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
  html, body, #map { margin: 0; height: 100%; background: #EFEDE0; }
  #msg { position: absolute; left: 24px; right: 24px; top: 40%; font: 16px sans-serif; color: #1A1C16;
         text-align: center; background: #FFFFFFE6; border-radius: 16px; padding: 16px; word-break: break-word; }
</style>
</head>
<body>
<div id="map"></div>
<div id="msg">Cargando la vista 3D…</div>
<script>
// Cualquier error se enseña en pantalla y va al logcat (etiqueta Trazo3D)
function show(text) { const m = document.getElementById('msg'); m.style.display = 'block'; m.textContent = text; console.error(text); }
function hide() { document.getElementById('msg').style.display = 'none'; }
window.onerror = (message, source, line) => { show('Error 3D: ' + message + ' (' + line + ')'); };
console.log('WebGL2: ' + !!document.createElement('canvas').getContext('webgl2'));
</script>
<script>
// Trazo llama a init(estilo, track, recuadro) cuando la página ha cargado.
let map = null, line = [], cum = [], total = 0, anim = null, bounds = null;

const R = 6371008.8, RAD = Math.PI / 180;
function dist(a, b) {
  const dLat = (b[1] - a[1]) * RAD, dLon = (b[0] - a[0]) * RAD;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * RAD) * Math.cos(b[1] * RAD) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}
function bearing(a, b) {
  const y = Math.sin((b[0] - a[0]) * RAD) * Math.cos(b[1] * RAD);
  const x = Math.cos(a[1] * RAD) * Math.sin(b[1] * RAD) - Math.sin(a[1] * RAD) * Math.cos(b[1] * RAD) * Math.cos((b[0] - a[0]) * RAD);
  return Math.atan2(y, x) / RAD;
}
function at(d) {
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= d) lo = m; else hi = m; }
  const span = cum[hi] - cum[lo], t = span > 0 ? (d - cum[lo]) / span : 0;
  return [line[lo][0] + (line[hi][0] - line[lo][0]) * t, line[lo][1] + (line[hi][1] - line[lo][1]) * t];
}

// Colores de los árboles según la estación (Trazo los manda en init)
let pal = { pineLight: '#5E9340', pineShade: '#3F6F2A', broadleaf: '#6FA048', broadleafShade: '#4D7F31',
            blossom: null, snow: false, broadleafShare: 0.3 };

function canvas(wDp, hDp) {
  const dpr = window.devicePixelRatio || 1, w = Math.round(wDp * dpr), h = Math.round(hDp * dpr);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  return { g: c.getContext('2d'), w, h, dpr };
}
function poly(g, pts, X, Y, color) {
  g.fillStyle = color; g.beginPath();
  pts.forEach(([x, y], i) => i ? g.lineTo(X(x), Y(y)) : g.moveTo(X(x), Y(y)));
  g.closePath(); g.fill();
}

// Pino "de pie" para el 3D: más alto y con sombra en la base, se dibuja mirando siempre a la cámara
function standingPine() {
  const { g, w, h, dpr } = canvas(30, 46);
  const k = w / 24, X = v => w / 2 + v * k, Y = v => h - 2 * dpr + (v - 4) * k * 1.05;
  g.fillStyle = 'rgba(40,50,30,0.25)';
  g.beginPath(); g.ellipse(w / 2, h - 3 * dpr, w * 0.32, 2.5 * dpr, 0, 0, 2 * Math.PI); g.fill();
  g.fillStyle = '#6B4F35'; g.fillRect(X(-1.6), Y(-7), 3.2 * k, 11 * k);
  poly(g, [[0,-40],[9,-25],[5,-25],[12,-8],[-12,-8],[-5,-25],[-9,-25]], X, Y, pal.pineLight);
  poly(g, [[0,-40],[9,-25],[5,-25],[12,-8],[0,-8]], X, Y, pal.pineShade);
  if (pal.snow) {
    poly(g, [[0,-40],[4.5,-32.5],[-4.5,-32.5]], X, Y, '#FFFFFF');
    poly(g, [[-9,-25],[9,-25],[7.5,-22.5],[-7.5,-22.5]], X, Y, '#FFFFFF');
    poly(g, [[-12,-8],[12,-8],[10.5,-5.5],[-10.5,-5.5]], X, Y, '#FFFFFF');
  }
  return { image: g.getImageData(0, 0, w, h), pixelRatio: dpr };
}

// Árbol de hoja ancha de pie (encina, roble, haya): verde, en flor u otoñal
function standingBroadleaf() {
  const { g, w, h, dpr } = canvas(30, 40);
  const k = w / 24, X = v => w / 2 + v * k, Y = v => h - 2 * dpr + (v - 4) * k * 1.0;
  g.fillStyle = 'rgba(40,50,30,0.25)';
  g.beginPath(); g.ellipse(w / 2, h - 3 * dpr, w * 0.34, 2.5 * dpr, 0, 0, 2 * Math.PI); g.fill();
  g.fillStyle = '#6B4F35'; g.fillRect(X(-1.8), Y(-12), 3.6 * k, 16 * k);
  const blob = (x, y, r, col) => { g.fillStyle = col; g.beginPath(); g.arc(X(x), Y(y), r * k, 0, 2 * Math.PI); g.fill(); };
  blob(0, -24, 11, pal.broadleaf); blob(-6, -17, 7.5, pal.broadleaf);
  blob(6, -17, 7.5, pal.broadleafShade); blob(4, -27, 7.5, pal.broadleafShade);
  if (pal.blossom) [[-6,-27],[2,-32],[7,-21],[-3,-18],[-8,-21],[1,-24]].forEach(([x, y]) => blob(x, y, 1.7, pal.blossom));
  return { image: g.getImageData(0, 0, w, h), pixelRatio: dpr };
}

// Mismo pino que en el mapa 2D (por si el estilo lo pide antes de ocultar esa capa)
function pineImage() {
  const { g, w, dpr } = canvas(72, 72), s = w;
  const pine = (cx, by, hh) => {
    const k = hh / 44, X = v => cx + v * k, Y = v => by - 4 * k + v * k;
    g.fillStyle = '#7A5C3E'; g.fillRect(X(-1.5), Y(-6), 3 * k, 10 * k);
    poly(g, [[0,-40],[9,-25],[5,-25],[12,-8],[-12,-8],[-5,-25],[-9,-25]], X, Y, pal.pineLight);
    poly(g, [[0,-40],[9,-25],[5,-25],[12,-8],[0,-8]], X, Y, pal.pineShade);
  };
  pine(s * 0.25, s * 0.40, s * 0.25);
  pine(s * 0.75, s * 0.90, s * 0.22);
  return { image: g.getImageData(0, 0, s, s), pixelRatio: dpr };
}

// ── Árboles dentro de los bosques ─────────────────────────────────────────
// El mapa base solo trae el contorno de cada bosque, así que se "planta" una
// rejilla fija en el mundo (no se mueve con la cámara) con un pequeño
// desorden por celda, y se queda con los puntos que caen dentro.
function hash2(a, b) {
  let h = Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function inRing(x, y, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
// Par-impar: un claro (agujero) dentro del bosque queda fuera
function inPolygon(x, y, rings) {
  let inside = false;
  for (const r of rings) if (inRing(x, y, r)) inside = !inside;
  return inside;
}
/** polygons: [[anillo exterior, agujeros…]]; area: {w, s, e, n, clat}; devuelve Features de punto. */
function plant(polygons, area, stepM, max, broadleafShare) {
  const dLat = stepM / 111320, dLon = dLat / Math.cos(area.clat * Math.PI / 180);
  const seen = new Set(), out = [];
  for (const rings of polygons) {
    if (!rings.length) continue;
    let w = Infinity, s = Infinity, e = -Infinity, n = -Infinity;
    for (const [x, y] of rings[0]) { if (x < w) w = x; if (x > e) e = x; if (y < s) s = y; if (y > n) n = y; }
    w = Math.max(w, area.w); e = Math.min(e, area.e); s = Math.max(s, area.s); n = Math.min(n, area.n);
    if (w > e || s > n) continue;
    for (let i = Math.floor(s / dLat); i * dLat <= n; i++) {
      for (let j = Math.floor(w / dLon); j * dLon <= e; j++) {
        const key = i + ':' + j;
        if (seen.has(key)) continue;
        const lat = (i + 0.15 + 0.7 * hash2(i, j)) * dLat;
        const lon = (j + 0.15 + 0.7 * hash2(j + 7, i + 3)) * dLon;
        if (lat < s || lat > n || lon < w || lon > e || !inPolygon(lon, lat, rings)) continue;
        seen.add(key);
        out.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [lon, lat] },
                   properties: { k: hash2(i * 3 + 1, j * 5 + 2) < broadleafShare ? 1 : 0, s: 0.8 + 0.45 * hash2(i + 11, j + 13) } });
        if (out.length >= max) return out;
      }
    }
  }
  return out;
}

const EMPTY = { type: 'FeatureCollection', features: [] };
/** Separación entre árboles del interior del bosque, en píxeles de pantalla. */
const TREE_SPACING_PX = 72;
let lastPlant = 0, plantTimer = null;
function refreshTrees() {
  plantTimer = null;
  if (!map || !map.getSource('trees')) return;
  lastPlant = performance.now();
  const z = map.getZoom();
  if (z < 12.5) { map.getSource('trees').setData(EMPTY); return; }
  // La separación se mide en píxeles de pantalla, no en metros: un árbol ocupa ~20 px, así que
  // van a ~2,5 veces su ancho y nunca se amontonan. El zoom se redondea a medios para que la
  // rejilla no cambie con cada pequeño movimiento de la cámara.
  const c = map.getCenter();
  const zq = Math.floor(z * 2) / 2;
  const metersPerPx = 40075016.686 * Math.cos(c.lat * RAD) / (512 * Math.pow(2, zq));
  const stepM = metersPerPx * TREE_SPACING_PX;
  const radius = stepM * 30;
  const dLat = radius / 111320, dLon = dLat / Math.cos(c.lat * RAD);
  const area = { w: c.lng - dLon, e: c.lng + dLon, s: c.lat - dLat, n: c.lat + dLat, clat: Math.round(c.lat * 2) / 2 };
  const polys = [];
  map.querySourceFeatures('omt', { sourceLayer: 'landcover', filter: ['==', ['get', 'class'], 'wood'] }).forEach(f => {
    const g = f.geometry;
    if (g.type === 'Polygon') polys.push(g.coordinates);
    else if (g.type === 'MultiPolygon') g.coordinates.forEach(p => polys.push(p));
  });
  const trees = plant(polys, area, stepM, 4500, pal.broadleafShare);
  map.getSource('trees').setData({ type: 'FeatureCollection', features: trees });
}
// Como mucho cada 1,2 s, y siempre una última vez al parar
function scheduleTrees() {
  if (plantTimer) return;
  const wait = Math.max(150, 1200 - (performance.now() - lastPlant));
  plantTimer = setTimeout(refreshTrees, wait);
}

let waitedFrames = 0;
/** Exageración del relieve según cuánto sube y baja la ruta: más en rutas suaves, poca en sierra. */
let exaggeration = 1.3;
function init(style, track, b, reliefMeters, palette) {
  if (palette) pal = Object.assign(pal, palette);
  if (reliefMeters > 0) exaggeration = Math.max(1.3, Math.min(2.8, 750 / reliefMeters));
  // Si el mapa se crea con la vista aún a 0×0, la cámara sale NaN y no se pinta nada.
  const el = document.getElementById('map');
  if (el.clientWidth === 0 || el.clientHeight === 0) {
    if (waitedFrames === 0) console.log('Esperando tamaño de la vista…');
    if (++waitedFrames > 300) { show('La vista 3D no tiene tamaño (' + el.clientWidth + 'x' + el.clientHeight + ').'); return; }
    requestAnimationFrame(() => init(style, track, b, reliefMeters, palette));
    return;
  }
  console.log('Vista ' + el.clientWidth + 'x' + el.clientHeight);
  try { start(style, track, b); } catch (e) { show('Error al iniciar el 3D: ' + e.message); }
}

function start(style, track, b) {
  if (typeof maplibregl === 'undefined') { show('No se pudo descargar el motor 3D. Comprueba la conexión.'); return; }
  console.log('MapLibre GL JS ' + maplibregl.getVersion());
  bounds = b;
  // Fuente de relieve aparte para el 3D (MapLibre recomienda no compartirla con el sombreado)
  style.sources.terrain3d = Object.assign({}, style.sources.terrain);
  // Relieve a z13 basta (~19 m/píxel) y pide muchas menos teselas mientras vuela
  style.sources.terrain3d.maxzoom = 13;
  map = new maplibregl.Map({
    container: 'map', style: style,
    center: [(b[0][0] + b[1][0]) / 2, (b[0][1] + b[1][1]) / 2], zoom: 11,
    pitch: 60, bearing: -20, maxPitch: 70,
    // La pantalla del móvil tiene densidad ~3,5: a 2 se ve igual de bien y va mucho más fluido
    pixelRatio: Math.min(2, window.devicePixelRatio || 1),
    attributionControl: false,
  });
  // Créditos arriba a la derecha, recogidos, para que no los tape el botón de abajo
  map.addControl(new maplibregl.AttributionControl({ compact: true }), 'top-right');
  window.addEventListener('resize', () => map.resize());
  map.once('idle', () => { console.log('Mapa listo y pintado'); collapseAttribution(); });
  map.on('error', e => console.error('MapLibre: ' + (e && e.error ? e.error.message : e)));
  map.on('styleimagemissing', e => {
    if (e.id === 'pino' && !map.hasImage('pino')) {
      const p = pineImage();
      map.addImage('pino', p.image, { pixelRatio: p.pixelRatio });
    }
  });
  map.on('load', () => {
    hide();
    map.resize();
    // Cámara rota (zoom o centro no numéricos): se vuelve a encuadrar la ruta
    const c = map.getCenter();
    if (!isFinite(map.getZoom()) || !isFinite(c.lng) || !isFinite(c.lat)) {
      console.log('Cámara no válida, reencuadrando');
      map.jumpTo({ center: [(b[0][0] + b[1][0]) / 2, (b[0][1] + b[1][1]) / 2], zoom: 11, pitch: 60, bearing: -20 });
    }
    map.fitBounds(b, { padding: 40, pitch: 60, bearing: -20, duration: 0 });
    console.log('Cámara zoom ' + map.getZoom().toFixed(2) + ' centro ' + map.getCenter().toArray().map(v => v.toFixed(4)));
    console.log('Exageración del relieve ' + exaggeration.toFixed(2));
    map.setTerrain({ source: 'terrain3d', exaggeration: exaggeration });
    try {
      // Cielo azul y niebla solo en la línea del horizonte
      map.setSky({ 'sky-color': '#7FB7E3', 'horizon-color': '#DCE8F0', 'fog-color': '#E4E9E6',
                   'sky-horizon-blend': 0.6, 'horizon-fog-blend': 0.9, 'fog-ground-blend': 1.0,
                   'atmosphere-blend': 0 });
    } catch (e) {}
    // Casas en 3D con la altura de OpenStreetMap (o 6 m si no la tiene); el edificio plano se oculta
    if (map.getLayer('building')) map.setLayoutProperty('building', 'visibility', 'none');
    map.addLayer({
      id: 'buildings-3d', type: 'fill-extrusion', source: 'omt', 'source-layer': 'building', minzoom: 13,
      paint: {
        'fill-extrusion-color': '#E6DFCD',
        'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 6],
        'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
        'fill-extrusion-opacity': 0.92,
      },
    }, 'place-label');

    // Árboles de pie. La trama plana de pinos del mapa 2D se oculta: en 3D parecía una pegatina en el suelo
    if (map.getLayer('landcover-wood-pines')) map.setLayoutProperty('landcover-wood-pines', 'visibility', 'none');
    const sp = standingPine(), sb = standingBroadleaf();
    map.addImage('pino-pie', sp.image, { pixelRatio: sp.pixelRatio });
    map.addImage('frondosa-pie', sb.image, { pixelRatio: sb.pixelRatio });
    const treeLayout = {
      'icon-anchor': 'bottom',
      'icon-pitch-alignment': 'viewport', 'icon-rotation-alignment': 'viewport',
      'icon-allow-overlap': true, 'icon-ignore-placement': true,
      // Los de delante tapan a los de detrás
      'symbol-z-order': 'viewport-y',
    };
    const wood = ['==', ['get', 'class'], 'wood'];
    // Borde del bosque, siempre de pinos
    map.addLayer({ id: 'trees-edge', type: 'symbol', source: 'omt', 'source-layer': 'landcover', minzoom: 12, filter: wood,
      layout: Object.assign({ 'symbol-placement': 'line', 'symbol-spacing': 120, 'icon-image': 'pino-pie',
        'icon-size': ['interpolate', ['linear'], ['zoom'], 12, 0.45, 14, 0.8, 16, 1.2] }, treeLayout) }, 'place-label');
    // Interior: la rejilla de plant(), con mezcla de pinos y frondosas según la estación
    map.addSource('trees', { type: 'geojson', data: EMPTY });
    map.addLayer({ id: 'trees-fill', type: 'symbol', source: 'trees', minzoom: 12.5,
      layout: Object.assign({
        'icon-image': ['match', ['get', 'k'], 1, 'frondosa-pie', 'pino-pie'],
        'icon-size': ['interpolate', ['linear'], ['zoom'],
          12.5, ['*', 0.4, ['get', 's']], 14, ['*', 0.65, ['get', 's']], 16, ['*', 1.0, ['get', 's']]],
      }, treeLayout) }, 'place-label');
    map.on('moveend', scheduleTrees);
    map.on('sourcedata', e => { if (e.sourceId === 'omt' && e.isSourceLoaded) scheduleTrees(); });
    map.once('idle', refreshTrees);

    collapseAttribution();

    map.addSource('track', { type: 'geojson', data: track });
    map.addLayer({ id: 'track-casing', type: 'line', source: 'track',
      layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#FFFFFF', 'line-width': 8 } });
    map.addLayer({ id: 'track-line', type: 'line', source: 'track',
      layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#C2410C', 'line-width': 4.5 } });
    map.addSource('rider', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({ id: 'rider', type: 'circle', source: 'rider',
      paint: { 'circle-radius': 9, 'circle-color': '#C5F26B', 'circle-stroke-color': '#1A1C16', 'circle-stroke-width': 3 } });

    line = []; track.geometry.coordinates.forEach(seg => seg.forEach(c => line.push(c)));
    cum = [0]; for (let i = 1; i < line.length; i++) cum.push(cum[i - 1] + dist(line[i - 1], line[i]));
    total = cum[cum.length - 1] || 0;
  });
}

// Los créditos son obligatorios (OSM, OpenFreeMap), pero se quedan recogidos en el botón (i)
function collapseAttribution() {
  document.querySelectorAll('.maplibregl-ctrl-attrib').forEach(el => {
    el.classList.remove('maplibregl-compact-show');
    el.removeAttribute('open');
  });
}

// Recorrido virtual: la cámara vuela siguiendo el track (unos 2,5 s por km, entre 30 y 90 s)
function fly() {
  if (!map || line.length < 2) return;
  stop();
  const duration = Math.min(90000, Math.max(30000, total / 1000 * 2500));
  let start = null;
  // Cámara algo más alta: menos teselas por segundo y sin "paredes" de relieve sin cargar
  const ZOOM = 14.0, PITCH = 66;
  map.jumpTo({ center: line[0], zoom: ZOOM, pitch: PITCH, bearing: bearing(line[0], at(Math.min(total, 300))) });
  const step = t => {
    if (start === null) start = t;
    const f = Math.min(1, (t - start) / duration), d = f * total;
    const p = at(d), ahead = at(Math.min(total, d + 400));
    const cur = map.getBearing(), target = bearing(p, ahead);
    const diff = ((target - cur + 540) % 360) - 180;
    map.jumpTo({ center: p, bearing: cur + diff * 0.06, pitch: PITCH, zoom: ZOOM });
    map.getSource('rider').setData({ type: 'Point', coordinates: p });
    scheduleTrees();
    if (f < 1) anim = requestAnimationFrame(step);
    else { anim = null; if (window.Trazo) Trazo.onFlyEnd(); }
  };
  // Arranca cuando la zona de salida ya está pintada (o a los 4 s como mucho)
  let started = false;
  const go = () => { if (!started) { started = true; anim = requestAnimationFrame(step); } };
  map.once('idle', go);
  setTimeout(go, 4000);
}

function stop() {
  if (anim) cancelAnimationFrame(anim);
  anim = null;
}

function overview() {
  stop();
  if (!map || !bounds) return;
  map.getSource('rider') && map.getSource('rider').setData({ type: 'FeatureCollection', features: [] });
  map.fitBounds(bounds, { padding: 40, pitch: 60, bearing: -20, duration: 1500 });
}
</script>
</body>
</html>
